name: Validacao PCD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java OpenJDK 27
      uses: actions/setup-java@v4
      with:
        java-version: '27'
        distribution: 'temurin' 

    - name: Compilar o projeto IscoT
      run: |
        mkdir -p bin
        javac -d bin $(find src/iscot -name "*.java")